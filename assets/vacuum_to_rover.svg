<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="780" height="300" fill="#f7f9fc"/>
  <text x="24" y="32" font-size="20" font-weight="700" fill="#16243a">改装路线：扫地机器人 → 宇宙挖矿机器人</text>

  <!-- 左：扫地机器人 -->
  <rect x="24" y="60" width="200" height="200" rx="12" fill="#ffffff" stroke="#c7d3e0"/>
  <text x="124" y="84" font-size="14" font-weight="700" text-anchor="middle" fill="#23344a">扫地机器人底座</text>
  <g font-size="12" fill="#3a4a5c">
    <rect x="44" y="100" width="160" height="26" rx="6" fill="#eef4fb" stroke="#bcd3ee"/><text x="124" y="118" text-anchor="middle">差速底盘 + 轮编码</text>
    <rect x="44" y="134" width="160" height="26" rx="6" fill="#eef4fb" stroke="#bcd3ee"/><text x="124" y="152" text-anchor="middle">LiDAR / ToF / IMU</text>
    <rect x="44" y="168" width="160" height="26" rx="6" fill="#eef4fb" stroke="#bcd3ee"/><text x="124" y="186" text-anchor="middle">ROS2 + Nav2</text>
    <rect x="44" y="202" width="160" height="26" rx="6" fill="#fde8ec" stroke="#f3b6c5"/><text x="124" y="220" text-anchor="middle">离心风机 + 尘盒（移除）</text>
    <rect x="44" y="236" width="160" height="16" rx="6" fill="#fde8ec" stroke="#f3b6c5"/><text x="124" y="248" text-anchor="middle" font-size="10">回充基站（移除）</text>
  </g>

  <!-- 箭头 + 改装说明 -->
  <text x="270" y="150" font-size="13" fill="#5b6b7d">① 拆吸尘</text>
  <text x="270" y="170" font-size="13" fill="#5b6b7d">② 换外壳</text>
  <text x="270" y="190" font-size="13" fill="#5b6b7d">③ 换工具头</text>
  <text x="270" y="210" font-size="13" fill="#5b6b7d">④ 换电源/算力</text>
  <path d="M236 160 L300 160" stroke="#3a7bd5" stroke-width="3" marker-end="url(#ar)"/>

  <!-- 右：宇宙挖矿机器人 -->
  <rect x="320" y="60" width="436" height="200" rx="12" fill="#ffffff" stroke="#c7d3e0"/>
  <text x="538" y="84" font-size="14" font-weight="700" text-anchor="middle" fill="#23344a">宇宙挖矿机器人 (CMR)</text>
  <g font-size="12" fill="#3a4a5c">
    <rect x="340" y="100" width="180" height="26" rx="6" fill="#eef4fb" stroke="#bcd3ee"/><text x="430" y="118" text-anchor="middle">差速底盘（保留）</text>
    <rect x="532" y="100" width="200" height="26" rx="6" fill="#eef4fb" stroke="#bcd3ee"/><text x="632" y="118" text-anchor="middle">多光谱相机 + 钻探谱</text>

    <rect x="340" y="134" width="180" height="26" rx="6" fill="#fff4e6" stroke="#f0c98a"/><text x="430" y="152" text-anchor="middle">316L 不锈钢外壳</text>
    <rect x="532" y="134" width="200" height="26" rx="6" fill="#fff4e6" stroke="#f0c98a"/><text x="632" y="152" text-anchor="middle">钻探/抓取工具头</text>

    <rect x="340" y="168" width="180" height="26" rx="6" fill="#f3effb" stroke="#c3a9ef"/><text x="430" y="186" text-anchor="middle">西电 SiC 功率器件</text>
    <rect x="532" y="168" width="200" height="26" rx="6" fill="#f3effb" stroke="#c3a9ef"/><text x="632" y="186" text-anchor="middle">抗辐射 SoC + 散热屏蔽</text>

    <rect x="340" y="202" width="392" height="26" rx="6" fill="#e9fbf0" stroke="#9fe3b8"/><text x="536" y="220" text-anchor="middle">样品仓（分格）+ 太阳能阵 / 二次电池（替换回充）</text>
  </g>

  <text x="24" y="288" font-size="11" fill="#8493a5">底座来自 OOMWOO / Robovacuum_Robot（开源 ROS2）；抗辐射核基于西电已在轨验证的 SiC 器件自行集成。</text>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3a7bd5"/>
    </marker>
  </defs>
</svg>
