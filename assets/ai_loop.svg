<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="780" height="320" fill="#f7f9fc"/>
  <text x="24" y="32" font-size="20" font-weight="700" fill="#16243a">AI 决策闭环（已在 simulation/ 跑通）</text>

  <!-- 环形流程 -->
  <g font-size="13" fill="#23344a">
    <!-- 勘探 -->
    <rect x="60" y="90" width="150" height="56" rx="10" fill="#eef4fb" stroke="#3a7bd5"/>
    <text x="135" y="114" text-anchor="middle" font-weight="700">① 勘探</text>
    <text x="135" y="132" text-anchor="middle" font-size="11">Nav2 全覆盖 (EXPLORE)</text>

    <!-- 感知 -->
    <rect x="310" y="90" width="150" height="56" rx="10" fill="#eef4fb" stroke="#3a7bd5"/>
    <text x="385" y="114" text-anchor="middle" font-weight="700">② 多光谱感知</text>
    <text x="385" y="132" text-anchor="middle" font-size="11">sense() 半径扫描</text>

    <!-- 去噪 -->
    <rect x="560" y="90" width="170" height="56" rx="10" fill="#fff4e6" stroke="#e0a93a"/>
    <text x="645" y="114" text-anchor="middle" font-weight="700">③ ASTERIS 去噪</text>
    <text x="645" y="132" text-anchor="middle" font-size="11">中值+平滑</text>

    <!-- 检测 -->
    <rect x="560" y="190" width="170" height="56" rx="10" fill="#e9fbf0" stroke="#2f9e5e"/>
    <text x="645" y="214" text-anchor="middle" font-weight="700">④ CIANNA 源检测</text>
    <text x="645" y="232" text-anchor="middle" font-size="11">矿石 MLP 分类</text>

    <!-- 决策 -->
    <rect x="310" y="190" width="150" height="56" rx="10" fill="#f3effb" stroke="#8a5bd5"/>
    <text x="385" y="214" text-anchor="middle" font-weight="700">⑤ 决策</text>
    <text x="385" y="232" text-anchor="middle" font-size="11">approach/mine/recharge</text>

    <!-- 执行/采矿 -->
    <rect x="60" y="190" width="150" height="56" rx="10" fill="#fde8ec" stroke="#d55b7b"/>
    <text x="135" y="214" text-anchor="middle" font-weight="700">⑥ 钻采+入库</text>
    <text x="135" y="232" text-anchor="middle" font-size="11">MINE + 样品仓</text>
  </g>

  <!-- 连线箭头（顺时针） -->
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6b7a8c"/></marker>
  </defs>
  <path d="M210 118 L308 118" stroke="#6b7a8c" stroke-width="2.5" marker-end="url(#a2)"/>
  <path d="M460 118 L558 118" stroke="#6b7a8c" stroke-width="2.5" marker-end="url(#a2)"/>
  <path d="M645 146 L645 188" stroke="#6b7a8c" stroke-width="2.5" marker-end="url(#a2)"/>
  <path d="M560 218 L312 218" stroke="#6b7a8c" stroke-width="2.5" marker-end="url(#a2)"/>
  <path d="M310 218 L212 218" stroke="#6b7a8c" stroke-width="2.5" marker-end="url(#a2)"/>
  <path d="M135 190 L135 148" stroke="#6b7a8c" stroke-width="2.5" marker-end="url(#a2)"/>

  <text x="24" y="290" font-size="12" fill="#5b6b7d">闭环：勘探→感知→去噪→检测→决策→采矿→回到勘探；续航低于阈值时插入 RECHARGE，周期 RELAY 回传遥测。</text>
  <text x="24" y="308" font-size="11" fill="#8493a5">实测：800 步 → 覆盖 73%，精确率 1.00，采矿 102 次，采集品位 23.7，电量耗尽至 16%。</text>
</svg>
