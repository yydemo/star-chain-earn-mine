<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="aP" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#22D3EE"/>
    </marker>
  </defs>
  <rect width="720" height="560" fill="#0B1120"/>
  <text x="32" y="42" fill="#E5EDF7" font-size="26" font-weight="bold">CMR 编程 — 编译工具链（落到广州）</text>
  <text x="32" y="64" fill="#94A3B8" font-size="14">西电广州 GaN 设计/编译 → 中试 → 南沙量产 → 辐照试验 → 区块链溯源</text>

  <!-- 区域底色 -->
  <rect x="32" y="96" width="330" height="360" rx="12" fill="#0c1626" stroke="#3B82F6" stroke-dasharray="6 4"/>
  <text x="48" y="120" fill="#3B82F6" font-size="14" font-weight="bold">广州 · 黄埔（西电广州创新中心）</text>
  <rect x="378" y="96" width="310" height="360" rx="12" fill="#0c1626" stroke="#F59E0B" stroke-dasharray="6 4"/>
  <text x="394" y="120" fill="#F59E0B" font-size="14" font-weight="bold">广州 · 南沙万顷沙（量产链）</text>

  <!-- 节点1 -->
  <g>
    <rect x="56" y="140" width="282" height="78" rx="10" fill="#0F1B33" stroke="#3B82F6"/>
    <text x="72" y="166" fill="#E5EDF7" font-size="14" font-weight="bold">① 电路 / RTL 设计</text>
    <text x="72" y="188" fill="#94A3B8" font-size="11">抗辐射 SoC / 电源管理芯片</text>
    <text x="72" y="206" fill="#94A3B8" font-size="11">GaN 微波/电力电子平台</text>
  </g>
  <line x1="197" y1="218" x2="197" y2="246" stroke="#22D3EE" stroke-width="2" marker-end="url(#aP)"/>

  <!-- 节点2 -->
  <g>
    <rect x="56" y="248" width="282" height="78" rx="10" fill="#0F1B33" stroke="#3B82F6"/>
    <text x="72" y="274" fill="#E5EDF7" font-size="14" font-weight="bold">② 交叉编译 / 固件构建</text>
    <text x="72" y="296" fill="#94A3B8" font-size="11">Zynq UltraScale+ / RTG4 / PolarFire</text>
    <text x="72" y="314" fill="#94A3B8" font-size="11">位流 + 固件（容器化 CI）</text>
  </g>
  <line x1="197" y1="326" x2="197" y2="354" stroke="#22D3EE" stroke-width="2" marker-end="url(#aP)"/>

  <!-- 节点3 -->
  <g>
    <rect x="56" y="356" width="282" height="78" rx="10" fill="#0F1B33" stroke="#3B82F6"/>
    <text x="72" y="382" fill="#E5EDF7" font-size="14" font-weight="bold">③ 西电广州中试线</text>
    <text x="72" y="404" fill="#94A3B8" font-size="11">6–8 英寸 GaN 全流程（2023 通线）</text>
    <text x="72" y="422" fill="#94A3B8" font-size="11">小批量工艺验证 / 合作代工</text>
  </g>

  <!-- 南沙节点4 -->
  <g>
    <rect x="402" y="140" width="262" height="78" rx="10" fill="#0F1B33" stroke="#F59E0B"/>
    <text x="418" y="166" fill="#E5EDF7" font-size="14" font-weight="bold">④ 南沙量产制造</text>
    <text x="418" y="188" fill="#94A3B8" font-size="11">南砂晶圆 12″ SiC 衬底</text>
    <text x="418" y="206" fill="#94A3B8" font-size="11">芯粤能 车规芯片 · 芯聚能 模块</text>
  </g>
  <line x1="533" y1="218" x2="533" y2="246" stroke="#22D3EE" stroke-width="2" marker-end="url(#aP)"/>

  <!-- 节点5 -->
  <g>
    <rect x="402" y="248" width="262" height="78" rx="10" fill="#0F1B33" stroke="#F59E0B"/>
    <text x="418" y="274" fill="#E5EDF7" font-size="14" font-weight="bold">⑤ 辐照试验</text>
    <text x="418" y="296" fill="#94A3B8" font-size="11">总剂量 / 单粒子（西电/院所平台）</text>
    <text x="418" y="314" fill="#94A3B8" font-size="11">形成飞行件数据</text>
  </g>
  <line x1="533" y1="326" x2="533" y2="354" stroke="#22D3EE" stroke-width="2" marker-end="url(#aP)"/>

  <!-- 节点6 区块链 -->
  <g>
    <rect x="402" y="356" width="262" height="78" rx="10" fill="#13233f" stroke="#22D3EE"/>
    <text x="418" y="382" fill="#22D3EE" font-size="14" font-weight="bold">⑥ 区块链溯源</text>
    <text x="418" y="404" fill="#94A3B8" font-size="11">试验数据 / 样品哈希上链</text>
    <text x="418" y="422" fill="#94A3B8" font-size="11">完整性 + 多机共识</text>
  </g>

  <!-- 跨区箭头 ③->④ -->
  <path d="M338,395 C360,395 360,180 402,180" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#aP)"/>
  <text x="350" y="300" fill="#F59E0B" font-size="11" transform="rotate(-78 350 300)">设计→制造</text>
</svg>
