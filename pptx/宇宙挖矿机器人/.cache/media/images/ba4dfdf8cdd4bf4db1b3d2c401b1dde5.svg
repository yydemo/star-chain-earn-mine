<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#22D3EE"/>
    </marker>
  </defs>
  <rect width="720" height="560" fill="#0B1120"/>
  <text x="32" y="42" fill="#E5EDF7" font-size="26" font-weight="bold">宇宙挖矿机器人 · 系统总体架构</text>
  <text x="32" y="64" fill="#94A3B8" font-size="14">Cosmic Mining Robot (CMR) — 从扫地机器人到地外采矿的完整闭环</text>

  <!-- Layer 5 software -->
  <g>
    <rect x="32" y="84" width="656" height="78" rx="10" fill="#0F1B33" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="48" y="108" fill="#22D3EE" font-size="15" font-weight="bold">软件层 · 决策/AI/视觉/区块链</text>
    <rect x="48" y="118" width="190" height="32" rx="6" fill="#13233f" stroke="#3B82F6"/><text x="60" y="139" fill="#E5EDF7" font-size="13">火星车仿真内核</text>
    <rect x="250" y="118" width="180" height="32" rx="6" fill="#13233f" stroke="#3B82F6"/><text x="262" y="139" fill="#E5EDF7" font-size="13">光谱去噪+源检测</text>
    <rect x="442" y="118" width="120" height="32" rx="6" fill="#13233f" stroke="#3B82F6"/><text x="454" y="139" fill="#E5EDF7" font-size="13">集尘盒视觉</text>
    <rect x="574" y="118" width="100" height="32" rx="6" fill="#13233f" stroke="#F59E0B"/><text x="586" y="139" fill="#F59E0B" font-size="13">区块链账本</text>
  </g>
  <line x1="360" y1="162" x2="360" y2="176" stroke="#22D3EE" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Layer 4 comms -->
  <g>
    <rect x="32" y="178" width="656" height="78" rx="10" fill="#0F1B33" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="48" y="202" fill="#22D3EE" font-size="15" font-weight="bold">硬件层 · 通讯</text>
    <rect x="48" y="212" width="300" height="32" rx="6" fill="#13233f" stroke="#3B82F6"/><text x="60" y="233" fill="#E5EDF7" font-size="13">Starlink 用户终端 (Musk LEO 星座)</text>
    <rect x="362" y="212" width="306" height="32" rx="6" fill="#13233f" stroke="#3B82F6"/><text x="374" y="233" fill="#E5EDF7" font-size="13">过顶窗口 / 时延 / 带宽 / store-and-forward</text>
  </g>
  <line x1="360" y1="256" x2="360" y2="270" stroke="#22D3EE" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Layer 3 compute/power -->
  <g>
    <rect x="32" y="272" width="656" height="78" rx="10" fill="#0F1B33" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="48" y="296" fill="#F59E0B" font-size="15" font-weight="bold">硬件层 · 算力 / 电源（西电第三代半导体）</text>
    <rect x="48" y="306" width="200" height="32" rx="6" fill="#1a2a14" stroke="#F59E0B"/><text x="60" y="327" fill="#E5EDF7" font-size="13">西电 SiC 功率器件</text>
    <rect x="262" y="306" width="200" height="32" rx="6" fill="#1a2a14" stroke="#F59E0B"/><text x="274" y="327" fill="#E5EDF7" font-size="13">西电广州 GaN SoC</text>
    <rect x="476" y="306" width="200" height="32" rx="6" fill="#1a2a14" stroke="#F59E0B"/><text x="488" y="327" fill="#E5EDF7" font-size="13">电源-算力合一主板</text>
  </g>
  <line x1="360" y1="350" x2="360" y2="364" stroke="#22D3EE" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Layer 2 shell -->
  <g>
    <rect x="32" y="366" width="656" height="78" rx="10" fill="#0F1B33" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="48" y="390" fill="#3B82F6" font-size="15" font-weight="bold">硬件层 · 机身</text>
    <rect x="48" y="400" width="420" height="32" rx="6" fill="#13233f" stroke="#3B82F6"/><text x="60" y="421" fill="#E5EDF7" font-size="13">316L 不锈钢轻量化外壳（散热鳍 + 被动粒子屏蔽）</text>
    <rect x="482" y="400" width="196" height="32" rx="6" fill="#13233f" stroke="#3B82F6"/><text x="494" y="421" fill="#E5EDF7" font-size="13">重量预算 33–49 kg</text>
  </g>
  <line x1="360" y1="444" x2="360" y2="458" stroke="#22D3EE" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Layer 1 base -->
  <g>
    <rect x="32" y="460" width="656" height="78" rx="10" fill="#0F1B33" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="48" y="484" fill="#3B82F6" font-size="15" font-weight="bold">硬件层 · 移动底座（开源扫地机器人改装）</text>
    <rect x="48" y="494" width="200" height="32" rx="6" fill="#13233f" stroke="#3B82F6"/><text x="60" y="515" fill="#E5EDF7" font-size="13">差速底盘 + 轮</text>
    <rect x="262" y="494" width="190" height="32" rx="6" fill="#13233f" stroke="#3B82F6"/><text x="274" y="515" fill="#E5EDF7" font-size="13">2D LiDAR + IMU</text>
    <rect x="466" y="494" width="212" height="32" rx="6" fill="#13233f" stroke="#3B82F6"/><text x="478" y="515" fill="#E5EDF7" font-size="13">ROS2 + Nav2 全覆盖</text>
  </g>
</svg>
