<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <radialGradient id="earth" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#0B1120"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <marker id="aS" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#22D3EE"/>
    </marker>
  </defs>
  <rect width="720" height="560" fill="#0B1120"/>
  <!-- 星点 -->
  <g fill="#94A3B8" opacity="0.6">
    <circle cx="80" cy="60" r="1.5"/><circle cx="200" cy="40" r="1"/><circle cx="340" cy="70" r="1.5"/>
    <circle cx="500" cy="50" r="1"/><circle cx="640" cy="80" r="1.5"/><circle cx="680" cy="180" r="1"/>
    <circle cx="60" cy="200" r="1"/><circle cx="120" cy="320" r="1.5"/><circle cx="660" cy="300" r="1"/>
    <circle cx="700" cy="420" r="1.5"/><circle cx="40" cy="460" r="1"/><circle cx="300" cy="500" r="1"/>
  </g>

  <text x="32" y="42" fill="#E5EDF7" font-size="26" font-weight="bold">近地轨道 Starlink 连接区域</text>
  <text x="32" y="64" fill="#94A3B8" font-size="14">CMR 经 Musk LEO 星座回传资产/遥测（覆盖带示意 · 轨道 ~550km）</text>

  <!-- LEO 轨道 -->
  <ellipse cx="360" cy="330" rx="320" ry="170" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="360" cy="330" rx="300" ry="120" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.4" transform="rotate(20 360 330)"/>
  <ellipse cx="360" cy="330" rx="300" ry="120" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.4" transform="rotate(-25 360 330)"/>

  <!-- 卫星 -->
  <g fill="#F59E0B">
    <rect x="100" y="250" width="14" height="14" rx="2"/>
    <rect x="600" y="250" width="14" height="14" rx="2"/>
    <rect x="250" y="160" width="14" height="14" rx="2"/>
    <rect x="470" y="450" width="14" height="14" rx="2"/>
  </g>
  <!-- 覆盖锥 -->
  <g fill="#22D3EE" opacity="0.12">
    <polygon points="107,257 40,360 200,360"/>
    <polygon points="607,257 540,360 700,360"/>
    <polygon points="257,167 200,320 360,320"/>
  </g>

  <!-- 地球 -->
  <circle cx="360" cy="430" r="150" fill="url(#earth)" stroke="#3B82F6" stroke-width="2"/>
  <path d="M260,420 Q320,380 380,420 T500,420" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.4"/>
  <text x="360" y="500" fill="#94A3B8" font-size="12" text-anchor="middle">地球表面（地月基地 / 地面站）</text>

  <!-- CMR 终端 -->
  <g>
    <circle cx="300" cy="360" r="14" fill="#0F1B33" stroke="#E5EDF7" stroke-width="2"/>
    <text x="300" y="365" fill="#E5EDF7" font-size="10" text-anchor="middle">CMR</text>
    <line x1="300" y1="346" x2="257" y2="174" stroke="#F59E0B" stroke-width="2" marker-end="url(#aS)"/>
    <text x="270" y="260" fill="#F59E0B" font-size="11" transform="rotate(-58 270 260)">上行链路</text>
  </g>
  <!-- 星间到地面站 -->
  <line x1="107" y1="257" x2="360" y2="360" stroke="#22D3EE" stroke-width="1.5" marker-end="url(#aS)" opacity="0.7"/>
  <line x1="607" y1="257" x2="520" y2="380" stroke="#22D3EE" stroke-width="1.5" marker-end="url(#aS)" opacity="0.7"/>

  <!-- 指标卡 -->
  <g>
    <rect x="500" y="430" width="200" height="110" rx="10" fill="#0F1B33" stroke="#1f3a63"/>
    <text x="516" y="456" fill="#22D3EE" font-size="13" font-weight="bold">链路指标</text>
    <text x="516" y="480" fill="#E5EDF7" font-size="12">覆盖率：100%</text>
    <text x="516" y="502" fill="#E5EDF7" font-size="12">时延：≈28–61 ms</text>
    <text x="516" y="524" fill="#94A3B8" font-size="11">store-and-forward 队列</text>
  </g>
</svg>
